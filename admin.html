<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071522">
<title>HUFFAZ EXCLUSIVE HQ — Admin</title>
<style>
:root{--bg:#071522;--panel:#0b2234;--panel2:#092033;--line:#24445e;--text:#f4f7fb;--muted:#9eb2c8;--gold:#f0bd3f;--green:#00d982;--red:#ff7777}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,rgba(43,105,150,.2),transparent 34%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}main{max-width:1100px;margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand h1{font-size:22px;margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}.panel{background:linear-gradient(180deg,rgba(12,39,59,.96),rgba(7,28,43,.96));border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 14px 38px rgba(0,0,0,.18);margin-bottom:14px}.controls{display:grid;grid-template-columns:1.1fr 1.4fr .8fr auto;gap:9px}.input,select,button,textarea{font:inherit}.input,select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid #315674;background:#071b2a;color:var(--text);outline:none}.btn{border:1px solid #315674;border-radius:12px;padding:11px 14px;background:#0a2031;color:#fff;font-weight:800;cursor:pointer}.btn.green{background:var(--green);color:#04151d;border-color:transparent}.btn:disabled{opacity:.55;cursor:wait}.summary{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stat{padding:12px;border:1px solid var(--line);border-radius:14px;background:#071c2c}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font-size:22px;margin-top:4px}.message{padding:10px 12px;border-radius:12px;background:#071c2c;border:1px solid var(--line);color:var(--muted);margin-top:10px}.message.err{color:#ffb1b1;border-color:rgba(255,119,119,.4)}.orders{display:grid;gap:10px}.order{border:1px solid var(--line);border-radius:17px;background:rgba(7,27,42,.86);padding:14px}.order-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.ref{font-weight:900;font-size:16px}.date{color:var(--muted);font-size:11px;margin-top:3px}.status{min-width:150px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.kv{padding:10px;border-radius:12px;background:#061a29;border:1px solid rgba(49,86,116,.6)}.kv small{display:block;color:var(--muted);font-size:10px}.kv b{display:block;margin-top:3px}.detail{margin-top:10px}.detail summary{cursor:pointer;color:#dbe7f2;font-weight:800}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions .input{width:150px}.note{margin-top:10px}.empty{text-align:center;color:var(--muted);padding:35px}.danger{color:#ffb1b1}.wa{background:#00d982;color:#04151d;border-color:transparent;text-decoration:none;display:inline-flex;align-items:center}.hide{display:none}@media(max-width:760px){main{padding:12px 10px 30px}.top{align-items:flex-start}.controls{grid-template-columns:1fr 1fr}.controls .wide{grid-column:1/-1}.summary{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.detail-grid{grid-template-columns:1fr}.status{min-width:0}.order-head{flex-direction:column}.actions .input{width:100%}}@media(max-width:420px){.summary{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr}.controls .wide{grid-column:auto}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand"><h1>HUFFAZ EXCLUSIVE HQ</h1><p>Order Dashboard • Private Admin</p></div>
    <button class="btn" type="button" onclick="clearSession()">Lock</button>
  </div>

  <section class="panel">
    <div class="controls">
      <input class="input wide" id="token" type="password" autocomplete="off" placeholder="ADMIN_TOKEN">
      <input class="input" id="search" placeholder="Reference / name / WhatsApp">
      <select id="status"><option value="">All statuses</option><option>Pending</option><option>Design</option><option>Production</option><option>Ready</option><option>Completed</option><option>Cancelled</option></select>
      <button class="btn green" id="refresh" type="button" onclick="loadOrders()">Refresh Orders</button>
    </div>
    <div id="message" class="message hide"></div>
  </section>

  <section class="summary" id="summary">
    <div class="stat"><small>Total</small><strong id="sTotal">0</strong></div>
    <div class="stat"><small>Pending</small><strong id="sPending">0</strong></div>
    <div class="stat"><small>Design</small><strong id="sDesign">0</strong></div>
    <div class="stat"><small>Production</small><strong id="sProduction">0</strong></div>
    <div class="stat"><small>Ready</small><strong id="sReady">0</strong></div>
    <div class="stat"><small>Completed</small><strong id="sCompleted">0</strong></div>
  </section>

  <section class="panel" style="margin-top:14px"><div id="orders" class="orders"><div class="empty">Enter ADMIN_TOKEN and tap Refresh Orders.</div></div></section>
</main>
<script src="/admin.js"></script>
</body>
</html>
